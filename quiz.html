<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio Python 🐍 - Lucas Feitoza (Turma 101)</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 27, 34, 0.85);
      --accent: #00ff88;
      --accent-glow: rgba(0, 255, 136, 0.4);
      --purple: #a855f7;
      --text: #f0f6fc;
      --subtext: #8b949e;
      --border: rgba(48, 54, 61, 0.8);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Courier New', Courier, monospace, system-ui;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Fundo com efeito Matrix / Código caindo */
    .bg-matrix {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.08;
      font-family: monospace;
      font-size: 14px;
      color: var(--accent);
      white-space: nowrap;
      user-select: none;
    }

    /* Brilho neon de fundo */
    .glow-bg {
      position: fixed;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
      top: -50px;
      right: -50px;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 255, 136, 0.1);
    }

    /* Header no estilo IDE/Terminal */
    .terminal-header {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0d1117;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-red { background: #ff5f56; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #27c93f; }

    .terminal-title {
      font-size: 0.75rem;
      color: var(--subtext);
      margin-left: auto;
      font-family: monospace;
    }

    /* Créditos de autoria */
    .author-badge {
      text-align: center;
      background: rgba(168, 85, 247, 0.1);
      border: 1px solid rgba(168, 85, 247, 0.3);
      color: var(--purple);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 15px;
      letter-spacing: 0.5px;
    }

    h1 {
      color: var(--accent);
      text-align: center;
      font-size: 1.5rem;
      margin: 10px 0 5px 0;
      text-shadow: 0 0 10px var(--accent-glow);
    }

    p.subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: var(--subtext);
      margin-bottom: 20px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.7rem;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .facil { background: rgba(0, 255, 136, 0.15); color: #00ff88; border: 1px solid rgba(0, 255, 136, 0.3); }
    .medio { background: rgba(255, 187, 0, 0.15); color: #ffbb00; border: 1px solid rgba(255, 187, 0, 0.3); }
    .avancado { background: rgba(168, 85, 247, 0.15); color: #a855f7; border: 1px solid rgba(168, 85, 247, 0.3); }

    .question-card {
      margin-bottom: 25px;
      background: rgba(13, 17, 23, 0.6);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .question-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background: #161b22;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px 16px;
      border-radius: 10px;
      text-align: left;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .option-btn:hover {
      border-color: var(--accent);
      background: #21262d;
    }

    .option-btn.selected {
      border-color: var(--accent);
      background: rgba(0, 255, 136, 0.12);
      color: var(--accent);
      font-weight: bold;
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #00ff88, #00b862);
      color: #000;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 15px var(--accent-glow);
      transition: all 0.2s ease;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    #result {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .result-score {
      font-size: 3rem;
      font-weight: bold;
      color: var(--accent);
      text-shadow: 0 0 20px var(--accent-glow);
      margin: 15px 0;
    }

    .result-level {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .code-box {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.8rem;
      color: var(--purple);
      text-align: left;
      margin-top: 15px;
      font-family: monospace;
    }
  </style>
</head>
<body>

<div class="glow-bg"></div>
<div class="bg-matrix" id="matrix"></div>

<div class="container">
  <div class="terminal-header">
    <div class="dot dot-red"></div>
    <div class="dot dot-yellow"></div>
    <div class="dot dot-green"></div>
    <div class="terminal-title">python_quiz.py</div>
  </div>

  <div class="author-badge">
    ⚡ DEV: Lucas Feitoza | Turma 101
  </div>

  <div id="quiz-screen">
    <h1>&lt;Desafio Python/&gt;</h1>
    <p class="subtitle">Descubra seu nível de programador!</p>

    <div id="quiz-container"></div>

    <button class="submit-btn" onclick="calcularResultado()">RUN CODE 🚀</button>
  </div>

  <div id="result">
    <h2>[STATUS: CONCLUÍDO]</h2>
    <div class="result-score" id="score-text">0/6</div>
    <div class="result-level" id="level-text"></div>
    <p id="desc-text" style="color: var(--subtext); font-size: 0.9rem; line-height: 1.4;"></p>
    
    <div class="code-box">
      <code>&gt; print("Projeto Eletivas - Lucas Feitoza (101)");</code>
    </div>

    <button class="submit-btn" onclick="location.reload()" style="margin-top: 20px;">RESTART 🔄</button>
  </div>
</div>

<script>
  // Fundo dinâmico estilo Matrix
  const matrix = document.getElementById('matrix');
  const codeLines = [
    'def validar_cpf(cpf): return len(cpf) == 11',
    'author = "Lucas Feitoza - Turma 101"',
    'if acertos == 6: print("Senior")',
    'for i in range(10): count += i',
    'lambda x: x % 11',
    'return True if val == 1 else False'
  ];
  let text = '';
  for(let i=0; i<30; i++) {
    text += codeLines[Math.floor(Math.random()*codeLines.length)] + '<br/>';
  }
  matrix.innerHTML = text;

  const perguntas = [
    { nivel: "facil", nivelTexto: "🟢 FÁCIL", q: "1. Qual comando exibe mensagens no terminal?", opts: ["echo()", "print()", "console.log()", "write()"], c: 1 },
    { nivel: "facil", nivelTexto: "🟢 FÁCIL", q: "2. Como se cria a variável 'idade' com valor 17?", opts: ["int idade = 17", "var idade = 17", "idade = 17", "let idade = 17"], c: 2 },
    { nivel: "medio", nivelTexto: "🟡 INTERMEDIÁRIO", q: "3. Qual o resultado de 10 % 3 em Python?", opts: ["3", "1", "3.33", "0"], c: 1 },
    { nivel: "medio", nivelTexto: "🟡 INTERMEDIÁRIO", q: "4. No algoritmo do CPF, o que o operador '%' faz?", opts: ["Porcentagem", "Resto da divisão inteira", "Multiplicação", "Eleva ao quadrado"], c: 1 },
    { nivel: "avancado", nivelTexto: "🔴 AVANÇADO", q: "5. Qual estrutura define uma função?", opts: ["function func():", "def func():", "create func():", "proc func():"], c: 1 },
    { nivel: "avancado", nivelTexto: "🔴 AVANÇADO", q: "6. Qual o tipo de dado de [1, 2, 3]?", opts: ["Tuple", "Dictionary", "List", "Array"], c: 2 }
  ];

  const respostas = {};

  function renderizarQuiz() {
    const container = document.getElementById("quiz-container");
    container.innerHTML = perguntas.map((p, idx) => `
      <div class="question-card">
        <span class="badge ${p.nivel}">${p.nivelTexto}</span>
        <div class="question-title">${p.q}</div>
        <div class="options">
          ${p.opts.map((opt, oIdx) => `
            <button class="option-btn" id="btn-${idx}-${oIdx}" onclick="selecionar(${idx}, ${oIdx})">
              <span style="opacity:0.4;">&gt;</span> ${opt}
            </button>
          `).join('')}
        </div>
      </div>
    `).join('');
  }

  function selecionar(qIdx, oIdx) {
    respostas[qIdx] = oIdx;
    perguntas[qIdx].opts.forEach((_, i) => {
      document.getElementById(`btn-${qIdx}-${i}`).classList.remove("selected");
    });
    document.getElementById(`btn-${qIdx}-${oIdx}`).classList.add("selected");
  }

  function calcularResultado() {
    if (Object.keys(respostas).length < perguntas.length) {
      alert("Por favor, responda a todas as perguntas antes de rodar o código!");
      return;
    }

    let acertos = 0;
    perguntas.forEach((p, idx) => {
      if (respostas[idx] === p.c) acertos++;
    });

    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("result").style.display = "block";
    document.getElementById("score-text").innerText = `${acertos}/${perguntas.length}`;

    const levelText = document.getElementById("level-text");
    const descText = document.getElementById("desc-text");

    if (acertos === 6) {
      levelText.innerHTML = "🏆 Nível: Dev Senior Python!";
      descText.innerText = "Você domina a sintaxe, a lógica de operadores e estruturas de dados! Pronto para o mercado.";
    } else if (acertos >= 4) {
      levelText.innerHTML = "⚡ Nível: Intermediário!";
      descText.innerText = "Você entende bem a lógica de programação e consegue criar scripts funcionais!";
    } else if (acertos >= 2) {
      levelText.innerHTML = "🌱 Nível: Aprendiz / Padawan!";
      descText.innerText = "Você já pegou os conceitos básicos. Continue praticando para virar um mestre!";
    } else {
      levelText.innerHTML = "💡 Nível: Curioso em Tecnologia!";
      descText.innerText = "Parabéns por testar! A programação é um superpoder e hoje é um ótimo dia para começar.";
    }
  }

  renderizarQuiz();
</script>
</body>
</html>
